<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title<MA CAFE /title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    h1<H1 MA CAFE
    <nav>
        <a href="#home">Home</a>
        <a href="#menu">Menu</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
    </nav>
</header>

<section id="home" class="hero">
    <h2>Welcome to MA CAFE </h2>
    <p>Fresh Food • Delicious Food • Cozy Atmosphere</p>
    <button onclick="orderNow()">Order Now</button>
</section>

<section id="menu">
    <h2>Our Menu</h2>

    <div class="card">
        <h3> 🍕 Pizza </h3>
        <p>₹130.00</p>
    </div>

    <div class="card">
        <h3>🍔Burger </h3>
        <p>₹150.00</p>
    </div>

    <div class="card">
        <h3>🥪 Sandwich</h3>
        <p>₹100.00</p>
    </div>
</section>

<section id="about">
    <h2>About Us</h2>
    <p>We serve fresh coffee and delicious meals every day.</p>
</section>

<section id="contact">
    <h2>Contact</h2>

    <form>
        <input type="text" placeholder="Your Name" required>
        <input type="email" placeholder="Email" required>
        <textarea placeholder="Message"></textarea>
        <button type="submit">Send</button>
    </form>
</section>

<footer>
    <p>© 2026 MA CAFE </p>
</footer>

<script src="script.js"></script>
